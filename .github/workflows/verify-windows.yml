name: Verify Windows editor
on:
  push:
    branches: [feat/operable-node-editor]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nect-svg-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check acceptance Rust formatting
        run: |
          rustfmt --edition 2021 --check src-tauri/src/main.rs src-tauri/src/acceptance_storage.rs
      - run: npm ci
      - run: npm run check
      - name: Run actual Chrome interaction tests
        shell: pwsh
        env:
          CHROMIUM_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: |
          $server = Start-Process -FilePath node -ArgumentList "node_modules/vite/bin/vite.js", "--host", "127.0.0.1", "--port", "5173" -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              try { Invoke-WebRequest http://127.0.0.1:5173 -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Editor server did not start' }
            npm run test:e2e
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - name: Build unsigned Windows app and NSIS installer
        shell: pwsh
        run: |
          rustup default stable
          New-Item -ItemType Directory -Force test-results | Out-Null
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 | Tee-Object -FilePath test-results/native-isolation-rust.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native-font-smoke.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes @tauri-apps/cli@2 build -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $standalone = 'src-tauri/target/release/nect-svg-desktop.exe'
          if (-not (Test-Path -LiteralPath $standalone -PathType Leaf)) { throw 'Standalone app is missing' }
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $binaries = @($standalone, $installers[0].FullName) | ForEach-Object {
            $file = Get-Item -LiteralPath $_
            [ordered]@{
              name = $file.Name
              bytes = $file.Length
              sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            native_app_acceptance = 'NOT RUN; Rust unit tests and build evidence only'
            isolation_tests = 'native-isolation-rust.log'
            binaries = @($binaries)
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 test-results/native-acceptance-build.json
      - name: Preserve bounded development evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: nect-svg-windows-development-${{ github.sha }}
          path: |
            test-results/*.png
            test-results/workflow-*.json
            test-results/workflow-*.svg
            test-results/japanese-*.json
            test-results/japanese-*.svg
            test-results/native-isolation-rust.log
            test-results/native-acceptance-build.json
            tests/fixtures/fonts/OFL.txt
            tests/fixtures/fonts/README.md
            src-tauri/Cargo.lock
            src-tauri/target/release/nect-svg-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 1
